services:
  - type: web
    name: creatorpilot
    runtime: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    healthCheckPath: /api/health
    envVars:
      - key: LLM_PROVIDER
        value: openrouter
      - key: LLM_API_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: LLM_TIMEOUT_MS
        value: 300000
      - key: OPENROUTER_APP_TITLE
        value: CreatorPilot
      - key: TRANSCRIPT_TIMEOUT_MS
        value: 10000
      - key: TRANSCRIPT_PROVIDER
        value: transcriptapi
      - key: TRANSCRIPTAPI_API_KEY
        sync: false
      - key: TRANSCRIPTAPI_API_URL
        value: https://transcriptapi.com/api/v2/youtube/transcript
      - key: TRANSCRIPT_HTTP_FALLBACK_ENABLED
        value: "false"
      - key: ANALYST_A_LLM_MODEL
        sync: false
      - key: ANALYST_B_LLM_MODEL
        sync: false
      - key: ANALYST_JUDGE_LLM_MODEL
        sync: false
      - key: RESEARCH_A_LLM_MODEL
        sync: false
      - key: RESEARCH_B_LLM_MODEL
        sync: false
      - key: RESEARCH_JUDGE_LLM_MODEL
        sync: false
      - key: SCRIPTWRITER_A_LLM_MODEL
        sync: false
      - key: SCRIPTWRITER_B_LLM_MODEL
        sync: false
      - key: SCRIPTWRITER_JUDGE_LLM_MODEL
        sync: false
