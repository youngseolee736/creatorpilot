services:
  - type: web
    name: creatorpilot
    runtime: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    healthCheckPath: /api/health
    envVars:
      - key: LLM_PROVIDER
        value: openai-compatible
      - key: LLM_API_BASE_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: SHOTSTACK_API_KEY
        sync: false
